@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --navy: #0f1b3c;
  --teal: #1ec8a5;
  --bg: #fafbfc;
  --card: #ffffff;
  --ink: #16213f;
  --ink-soft: #8791a1;
  --border: #eaedf2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', 'IBM Plex Sans KR', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }

header.site-header {
  background: var(--navy);
  padding: 20px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand .bubble { width: 26px; height: 26px; display: block; }
.brand .name { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.brand .sub { color: #7c8bab; font-size: 11px; font-family: 'IBM Plex Mono', monospace; }

nav.tabs { display: flex; gap: 4px; }
nav.tabs a {
  font-size: 13px; font-weight: 500; padding: 7px 16px;
  color: #8b96b3; border-radius: 999px;
}
nav.tabs a.active { background: var(--teal); color: var(--navy); font-weight: 700; }

main { max-width: 620px; margin: 0 auto; padding: 36px 24px 80px; }

.flash {
  background: #fef2f2; color: #b91c1c;
  padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px;
}

.empty { color: var(--ink-soft); padding: 70px 0; text-align: center; font-size: 14px; }

/* Year tabs — underline style */
.year-tabs {
  display: flex; gap: 22px; overflow-x: auto;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
}
.year-tab {
  font-size: 14px; font-weight: 500; color: var(--ink-soft);
  padding: 4px 2px 10px; flex-shrink: 0;
  border-bottom: 2px solid transparent;
}
.year-tab.active { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }
.year-tab:not(.active):hover { color: var(--ink); }

/* Month tab carousel */
.month-tabs {
  display: flex; gap: 2px; overflow-x: auto;
  margin-bottom: 28px;
}
.month-tab {
  font-size: 12.5px; font-weight: 500; color: #c7cdd8;
  padding: 6px 11px; border-radius: 7px; flex-shrink: 0;
}
.month-tab.has-data { color: var(--ink-soft); }
.month-tab.active { background: var(--navy); color: #fff; font-weight: 600; }

/* Big current month + arrows */
.month-nav {
  display: flex; align-items: center; justify-content: center; gap: 20px;
  margin-bottom: 22px;
}
.month-title { font-size: 22px; font-weight: 700; margin: 0; color: var(--navy); min-width: 130px; text-align: center; letter-spacing: -0.01em; }
.nav-btn {
  width: 28px; height: 28px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-soft); font-weight: 400; font-size: 16px;
}
.nav-btn:hover { color: var(--teal); }

/* Month calendar grid */
.month-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 14px 20px;
  margin-bottom: 28px;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink); padding-bottom: 10px; }
.cal-dow.sun { color: #e0574a; }
.cal-dow.sat { color: var(--teal); }
.cal-cell {
  aspect-ratio: 1 / 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #b6bdc9;
}
.cal-cell.blank { background: transparent; }

.cap-dot {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  color: var(--navy);
  font-weight: 600;
  font-size: 12.5px;
  cursor: pointer;
  background: #eafaf6;
}
.cap-dot:hover { background: var(--teal); color: #fff; }
.cal-cell.selected .cap-dot { background: var(--navy); color: #fff; }

/* Day detail panel */
.panel-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.panel-date {
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
  color: var(--navy);
}
.save-all-btn {
  font-size: 12px; font-weight: 600; color: var(--teal);
  padding: 5px 0; border-bottom: 1px solid var(--teal);
}
.save-all-btn:hover { color: #159179; border-color: #159179; }

.panel-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px;
}
.panel-tile {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
}
.panel-tile img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: #f0f2f5; }
.panel-meta { padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-label { font-size: 12px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-btn { font-size: 11px; font-weight: 600; color: var(--teal); flex-shrink: 0; }
.save-btn:hover { text-decoration: underline; }

/* Session detail (filmstrip) */
.filmstrip { display: flex; flex-direction: column; gap: 18px; }
.frame { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
.frame img { width: 100%; display: block; border-radius: 8px; }
.frame .seq { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--teal); margin-bottom: 8px; font-weight: 600; }

/* Upload form */
form.upload-form { display: flex; flex-direction: column; gap: 16px; max-width: 480px; }
form.upload-form label { font-size: 12px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 6px; }
form.upload-form input[type=text],
form.upload-form input[type=date],
form.upload-form input[type=time],
form.upload-form input[type=file] {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--card); font-family: 'Inter', sans-serif; font-size: 14px;
}
.row2 { display: flex; gap: 12px; }
.row2 > div { flex: 1; }

button.submit {
  font-size: 14px; font-weight: 700; background: var(--navy); color: #fff;
  border: none; border-radius: 10px; padding: 12px 18px; cursor: pointer; width: fit-content;
}
button.submit:hover { background: #16265a; }
  </style>
</head>
